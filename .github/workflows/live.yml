name: Live

# Smoke test against the real public services the fixtures stand in for. The default suite is hermetic, so nothing
# here gates a merge: this runs on a push to main, and on demand, to catch drift between the local fixture servers and
# the services they imitate.
#
# main only moves at release time, so this is effectively a release check. Use the manual trigger in between if a
# change touches a fixture server.
#
# A failure is often unrelated to the commit that triggered it - an upstream outage, or a CDN changing a header - so
# read one as "look at the fixtures", not "revert the commit".

on:
    push:
        branches: [main]
        paths-ignore:
            - "*.md"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    live:
        name: Live smoke test
        runs-on: ubuntu-latest

        env:
            # `npm/test.js` refuses `--live` under CI unless this is set. Setting it in any other workflow would turn
            # a live run into a merge gate.
            NEWMAN_LIVE_IN_CI: "1"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use latest Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: latest
                  cache: "npm"

            - name: Install
              run: npm ci

            # a single OS and Node version: service drift is identical on every platform, and the hermetic matrix in
            # ci.yml is what covers platform differences
            - name: Run tests against live services
              run: npm run test-live
